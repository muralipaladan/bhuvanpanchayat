<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhuvan GWC Village & Cadastral Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .status-panel {
      position: absolute;
      top: 12px;
      left: 60px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 13px;
      z-index: 1000;
      max-width: 320px;
    }
    .status-panel b {
      color: #0056b3;
    }
    .zoom-alert {
      color: #d9534f;
      font-weight: bold;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="status-panel">
  <b>Bhuvan Panchayat (GWC WMS)</b><br>
  <span>നിലവിലെ സൂം ലെവൽ: <span id="zoomLevel">13</span></span>
  <div id="zoomNotice" class="zoom-alert">കാഡസ്ട്രൽ കാണാൻ ഇനിയും സൂം ചെയ്യുക!</div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // മാപ്പ് ഇനിഷ്യലൈസ് ചെയ്യുന്നു
  const map = L.map('map', {
    center: [10.8929, 76.1407], // നൽകിയ BBOX-ന്റെ കേന്ദ്രം
    zoom: 13,
    maxZoom: 22
  });

  // 1. Base Maps
  const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 22
  }).addTo(map);

  const satelliteBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 22
  });

  // ഭുവന്റെ യഥാർത്ഥ ടൈൽഡ് WMS എൻഡ്‌പോയിന്റ്
  const gwcWmsUrl = 'https://bhuvan-panchayat3.nrsc.gov.in/geoserver/gwc/service/wms';

  // 2. Village Boundary Layer
  const villageLayer = L.tileLayer.wms(gwcWmsUrl, {
    layers: 'v3:village',
    format: 'image/png',
    transparent: true,
    version: '1.1.1',
    maxZoom: 22
  }).addTo(map);

  // 3. Cadastral Layer (പ്ലോട്ട് ബൗണ്ടറികൾ)
  const cadastralLayer = L.tileLayer.wms(gwcWmsUrl, {
    layers: 'v3:cadastral',
    format: 'image/png',
    transparent: true,
    version: '1.1.1',
    minZoom: 14, // സൂം കുറഞ്ഞാൽ അനാവശ്യ റിക്വസ്റ്റുകൾ തടയാൻ
    maxZoom: 22
  }).addTo(map);

  // Layer Controls
  const baseMaps = {
    "OpenStreetMap": osmBase,
    "Satellite": satelliteBase
  };

  const overlayMaps = {
    "Village Boundary (v3:village)": villageLayer,
    "Cadastral Plots (v3:cadastral)": cadastralLayer
  };

  L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);

  // സൂം ലെവൽ അറിയിപ്പ് അപ്‌ഡേറ്റ് ചെയ്യാനുള്ള ഫംഗ്ഷൻ
  const zoomText = document.getElementById('zoomLevel');
  const zoomNotice = document.getElementById('zoomNotice');

  map.on('zoomend', function() {
    const currentZoom = map.getZoom();
    zoomText.innerText = currentZoom;
    if (currentZoom >= 15) {
      zoomNotice.style.color = '#28a745';
      zoomNotice.innerText = 'കാഡസ്ട്രൽ പ്ലോട്ടുകൾ ലഭ്യമാണ്';
    } else {
      zoomNotice.style.color = '#d9534f';
      zoomNotice.innerText = 'കാഡസ്ട്രൽ കാണാൻ ഇനിയും സൂം ചെയ്യുക (Zoom >= 15)';
    }
  });
</script>

</body>
</html>
